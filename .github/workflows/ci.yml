name: FitArc CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Clean install from lockfile
        run: npm ci --no-audit --no-fund
      - name: Build production website
        run: npm run build
      - name: Generate dependency audit report
        if: always()
        run: |
          npm audit --json > npm-audit-report.json || true
          node -e "const a=require('./npm-audit-report.json'); console.log('Dependency audit summary:', JSON.stringify(a.metadata?.vulnerabilities || {}));"
      - name: Enforce clean dependency audit
        run: npm audit
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fitarc-npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: ignore
          retention-days: 14
